<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日待辦</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <p class="eyebrow">TODAY / TODO</p>
        <h1 id="page-title">今日待辦</h1>
        <p class="subtitle">把想完成的事，一件一件放進今天。</p>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">新增待辦事項</label>
        <input id="todo-input" name="todo" type="text" placeholder="接下來想完成什麼？" autocomplete="off" maxlength="120">
        <button type="submit">新增</button>
      </form>

      <div class="list-area">
        <p class="empty-state" id="empty-state">還沒有任何待辦事項,新增一個吧!</p>
        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
      </div>

      <footer class="app-footer">
        <span id="remaining-count">未完成:0 項</span>
        <button class="clear-completed-button" id="clear-completed" type="button" disabled aria-label="清除所有已完成的待辦事項">清除已完成</button>
        <span class="footer-mark" aria-hidden="true">✦</span>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
